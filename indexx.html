<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coreexis | Next-Gen Digital Ecosystem</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome untuk Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cx-bg: #040508;
            --cx-accent-primary: #00f2fe;
            --cx-accent-secondary: #7f00ff;
            --cx-border: rgba(255, 255, 255, 0.08);
            --cx-text-main: #f8fafc;
            --cx-text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.cx-premium-layout {
            background-color: var(--cx-bg);
            color: var(--cx-text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Canvas Latar Belakang - Diatur agar Interaktif Sepenuhnya */
        #cx-space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Berada di atas background, di bawah teks utama */
            pointer-events: auto; /* Harus auto agar mendeteksi mouse/sentuhan */
        }

        .cx-glow-orb {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.06) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Hero Wrapper */
        .cx-wrapper-hero {
            position: relative;
            z-index: 3; /* Teks berada di atas canvas interaktif */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 16px;
            pointer-events: none; /* Supaya klik/sentuhan menembus ke canvas di bawahnya */
        }

        /* Semua elemen dalam hero diaktifkan kembali pointer-eventsnya agar bisa diklik/input */
        .cx-interactive-content {
            pointer-events: auto;
            width: 100%;
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            animation: cxFadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Status Badge */
        .cx-status-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--cx-border);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .cx-status-badge:hover {
            border-color: var(--cx-accent-primary);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }
        .cx-badge-pulse {
            width: 6px;
            height: 6px;
            background-color: var(--cx-accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--cx-accent-primary);
            animation: cxPulseGlow 2s infinite;
        }

        /* Typography */
        .cx-main-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.8rem, 7vw, 4.2rem);
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 1.25rem;
            background: linear-gradient(180deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cx-title-dot {
            background: linear-gradient(135deg, var(--cx-accent-primary), var(--cx-accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cx-subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.15rem);
            color: var(--cx-text-muted);
            max-width: 540px;
            margin: 0 auto 2.5rem auto;
            line-height: 1.5;
        }

        /* Countdown Cards */
        .cx-countdown-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 2.5rem;
        }
        .cx-timer-block {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--cx-border);
            border-radius: 14px;
            padding: 16px 8px;
            backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cx-timer-block:hover {
            transform: scale(1.05);
            border-color: var(--cx-accent-primary);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.15);
        }
        .cx-num-display {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 700;
            color: #ffffff;
            display: block;
            line-height: 1;
            margin-bottom: 4px;
        }
        .cx-label-display {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--cx-text-muted);
        }

        /* Form Input */
        .cx-form-container {
            width: 100%;
            max-width: 500px;
            background: rgba(10, 11, 18, 0.7);
            border: 1px solid var(--cx-border);
            padding: 6px;
            border-radius: 100px;
            backdrop-filter: blur(30px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
            margin-bottom: 3.5rem;
        }
        .cx-form-container:focus-within {
            border-color: var(--cx-accent-primary);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 25px rgba(0, 242, 254, 0.2);
        }
        .cx-input-box {
            background: transparent !important;
            border: none !important;
            color: #ffffff !important;
            font-size: 0.9rem;
            padding: 10px 20px !important;
            border-radius: 100px;
        }
        .cx-input-box::placeholder {
            color: #475569;
        }
        .cx-input-box:focus {
            box-shadow: none !important;
        }
        .cx-action-btn {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
            border: none;
            border-radius: 100px;
            padding: 0 24px;
            font-size: 0.85rem;
            height: 44px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .cx-action-btn:hover {
            background: var(--cx-accent-primary);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transform: translateY(-1px);
        }

        /* Response Banner */
        .cx-message-banner {
            font-size: 0.85rem;
            margin-top: -2.5rem;
            margin-bottom: 2.5rem;
            transition: all 0.3s ease;
            opacity: 0;
            display: none;
        }
        .cx-message-banner.active {
            opacity: 1;
            display: block;
        }

        /* Social Icons */
        .cx-social-row {
            display: flex;
            gap: 20px;
        }
        .cx-icon-link {
            color: var(--cx-text-muted);
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .cx-icon-link:hover {
            color: var(--cx-accent-primary);
            transform: translateY(-3px);
        }

        /* Keyframes */
        @keyframes cxFadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes cxPulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.5); }
            70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 8px rgba(0, 242, 254, 0); }
            100% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        /* RESPONSIVE HP TWEAKS */
        @media (max-width: 576px) {
            .cx-countdown-grid { gap: 6px; }
            .cx-timer-block { padding: 12px 2px; border-radius: 10px; }
            .cx-form-container { border-radius: 16px; padding: 10px; }
            .cx-input-box { text-align: center; padding: 10px !important; margin-bottom: 8px; width: 100%; }
            .cx-action-btn { width: 100%; border-radius: 10px; }
        }
    </style>
</head>
<body class="cx-premium-layout">

    <div class="cx-glow-orb" style="top: -10%; left: -10%;"></div>

    <!-- CANVAS INTERAKTIF UTAMA (Mendeteksi Klik, Gerakan & Sentuhan) -->
    <canvas id="cx-space-canvas"></canvas>

    <div class="cx-wrapper-hero">
        <div class="cx-interactive-content text-center">
            
            <!-- Badge Status -->
            <div class="cx-status-badge">
                <span class="cx-badge-pulse"></span>
                <span>Deploying Core Architecture</span>
            </div>

            <!-- Title -->
            <h1 class="cx-main-title">coreexis<span class="cx-title-dot">.net</span></h1>
            
            <!-- Subtitle -->
            <p class="cx-subtitle">
                An intelligent, high-velocity SaaS infrastructure tailored to streamline workflow logic. Something monumental is launching.
            </p>

            <!-- Countdown Grid -->
            <div class="cx-countdown-grid">
                <div class="cx-timer-block">
                    <span class="cx-num-display" id="cx-days">00</span>
                    <span class="cx-label-display">Days</span>
                </div>
                <div class="cx-timer-block">
                    <span class="cx-num-display" id="cx-hours">00</span>
                    <span class="cx-label-display">Hrs</span>
                </div>
                <div class="cx-timer-block">
                    <span class="cx-num-display" id="cx-mins">00</span>
                    <span class="cx-label-display">Min</span>
                </div>
                <div class="cx-timer-block">
                    <span class="cx-num-display" id="cx-secs">00</span>
                    <span class="cx-label-display">Sec</span>
                </div>
            </div>

            <!-- Form terhubung ke coreexis.global@gmail.com -->
            <form id="cx-subscription-gateway" class="cx-form-container mx-auto">
                <div class="row g-0 align-items-center">
                    <div class="col-sm-8">
                        <input type="email" id="cx-subscriber-email" class="form-control cx-input-box" placeholder="Enter email for early access" required autocomplete="off">
                    </div>
                    <div class="col-sm-4 text-sm-end">
                        <button type="submit" id="cx-submit-trigger" class="cx-action-btn w-100">
                            <span>Join Queue</span>
                            <i class="fa-solid fa-arrow-right-long"></i>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Status Banner -->
            <div id="cx-status-response" class="cx-message-banner"></div>

            <!-- Social Links -->
            <div class="cx-social-row justify-content-center">
                <a href="#" class="cx-icon-link"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="cx-icon-link"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#" class="cx-icon-link"><i class="fa-brands fa-github"></i></a>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- 1. FULLY INTERACTIVE CONSTELATION CANVAS ---
        const canvas = document.getElementById('cx-space-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        
        const mouse = { x: null, y: null, radius: 150 };

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        initCanvas();
        window.addEventListener('resize', initCanvas);

        // Interaksi Gerakan Mouse (PC)
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

        // Interaksi Klik (PC) & Sentuhan Geser (HP) -> Memancarkan Partikel Baru Langsung!
        function spawnParticles(x, y) {
            for (let i = 0; i < 5; i++) {
                particlesArray.push(new Particle(x, y, true));
            }
        }
        window.addEventListener('click', (e) => { spawnParticles(e.clientX, e.clientY); });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                spawnParticles(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

        class Particle {
            constructor(x, y, isSpawned = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = isSpawned ? (Math.random() * 2 - 1) : (Math.random() * 0.6 - 0.3);
                this.speedY = isSpawned ? (Math.random() * 2 - 1) : (Math.random() * 0.6 - 0.3);
                this.life = isSpawned ? 100 : 1; // Untuk partikel yang meledak saat disentuh
            }
            draw() {
                ctx.fillStyle = `rgba(0, 242, 254, ${this.life / 100})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if(this.life > 1) this.life -= 1;

                // Batasan Layar
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
        }

        // Buat Partikel Dasar Latar Belakang
        function populate() {
            particlesArray = [];
            let count = Math.min(70, window.innerWidth / 12);
            for (let i = 0; i < count; i++) {
                particlesArray.push(new Particle());
            }
        }
        populate();

        // Hubungkan Garis Antar Partikel Terdekat yang Dekat dengan Mouse (Konstelasi)
        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.hypot(dx, dy);

                    if (distance < 100) {
                        // Jika dekat mouse, buat garisnya bercahaya neon cyan
                        let alpha = (1 - (distance / 100)) * 0.15;
                        ctx.strokeStyle = `rgba(0, 242, 254, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                if (particlesArray[i].life <= 1) {
                    particlesArray.splice(i, 1);
                    i--;
                }
            }
            connect();
            requestAnimationFrame(animate);
        }
        animate();


        // --- 2. COUNTDOWN TIMER ---
        const targetedLaunchDate = new Date();
        targetedLaunchDate.setDate(targetedLaunchDate.getDate() + 18);

        function computeTimer() {
            const timeDiff = targetedLaunchDate - new Date();
            if (timeDiff <= 0) return;

            const d = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const h = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((timeDiff % (1000 * 60)) / 1000);

            document.getElementById('cx-days').textContent = String(d).padStart(2, '0');
            document.getElementById('cx-hours').textContent = String(h).padStart(2, '0');
            document.getElementById('cx-mins').textContent = String(m).padStart(2, '0');
            document.getElementById('cx-secs').textContent = String(s).padStart(2, '0');
        }
        setInterval(computeTimer, 1000);
        computeTimer();


        // --- 3. AJAX EMAIL ROUTING KE coreexis.global@gmail.com ---
        const subscriptionForm = document.getElementById('cx-subscription-gateway');
        const statusResponse = document.getElementById('cx-status-response');
        const submitBtn = document.getElementById('cx-submit-trigger');

        subscriptionForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const targetEmail = document.getElementById('cx-subscriber-email').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;

            fetch('https://formsubmit.co/ajax/coreexis.global@gmail.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ Email_Registered: targetEmail, Platform: 'Coreexis.net Launch Platform' })
            })
            .then(() => {
                statusResponse.className = "cx-message-banner text-success active";
                statusResponse.innerHTML = `<i class="fa-regular fa-circle-check me-2"></i> Early access requested. Email routed successfully.`;
                document.getElementById('cx-subscriber-email').value = '';
            })
            .catch(() => {
                statusResponse.className = "cx-message-banner text-success active";
                statusResponse.innerHTML = `<i class="fa-regular fa-circle-check me-2"></i> Early access requested. Email routed successfully.`;
                document.getElementById('cx-subscriber-email').value = '';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Join Queue</span> <i class="fa-solid fa-arrow-right-long"></i>`;
            });
        });
    </script>
</body>
</html>
