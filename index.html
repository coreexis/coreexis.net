<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coreexis | Next-Gen Digital Ecosystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cx-bg: #06070b;
            --cx-accent-primary: #00f2fe;
            --cx-accent-secondary: #7f00ff;
            --cx-card-glow: rgba(0, 242, 254, 0.03);
            --cx-border: rgba(255, 255, 255, 0.07);
            --cx-text-main: #f8fafc;
            --cx-text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.cx-premium-layout {
            background-color: var(--cx-bg);
            color: var(--cx-text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Interactive Particle Canvas Background */
        #cx-space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Glow Orbs di Pojok */
        .cx-glow-orb-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }
        .cx-glow-orb-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            bottom: -10%;
            right: -10%;
            background: radial-gradient(circle, rgba(127, 0, 255, 0.08) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Hero Wrapper */
        .cx-wrapper-hero {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Status Badge */
        .cx-status-badge {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--cx-border);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            transition: border-color 0.4s ease;
        }
        .cx-status-badge:hover {
            border-color: var(--cx-accent-primary);
        }
        .cx-badge-pulse {
            width: 6px;
            height: 6px;
            background-color: var(--cx-accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--cx-accent-primary);
            animation: cxPulseGlow 2s infinite;
        }

        /* Typography */
        .cx-main-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(180deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cx-title-dot {
            background: linear-gradient(135deg, var(--cx-accent-primary), var(--cx-accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cx-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--cx-text-muted);
            max-width: 600px;
            margin: 0 auto 3.5rem auto;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Countdown Glassmorphism Grid */
        .cx-countdown-grid {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 3.5rem;
            width: 100%;
            max-width: 520px;
        }
        .cx-timer-block {
            flex: 1;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--cx-border);
            border-radius: 16px;
            padding: 20px 10px;
            backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .cx-timer-block::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }
        .cx-timer-block:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 242, 254, 0.25);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 20px var(--cx-card-glow);
        }
        .cx-num-display {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 700;
            color: #ffffff;
            display: block;
            line-height: 1;
            margin-bottom: 4px;
        }
        .cx-label-display {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--cx-text-muted);
            font-weight: 500;
        }

        /* Capsule Form Input */
        .cx-form-container {
            width: 100%;
            max-width: 550px;
            background: rgba(10, 11, 18, 0.6);
            border: 1px solid var(--cx-border);
            padding: 8px;
            border-radius: 100px;
            backdrop-filter: blur(30px);
            box-shadow: 0 24px 60px rgba(0,0,0,0.8);
            transition: all 0.4s ease;
            margin-bottom: 4rem;
        }
        .cx-form-container:focus-within {
            border-color: var(--cx-accent-primary);
            box-shadow: 0 24px 60px rgba(0,0,0,0.8), 0 0 25px rgba(0, 242, 254, 0.1);
        }
        .cx-input-box {
            background: transparent !important;
            border: none !important;
            color: #ffffff !important;
            font-size: 0.95rem;
            padding: 12px 24px !important;
            border-radius: 100px;
        }
        .cx-input-box::placeholder {
            color: #475569;
        }
        .cx-input-box:focus {
            box-shadow: none !important;
        }
        .cx-action-btn {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
            border: none;
            border-radius: 100px;
            padding: 0 28px;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .cx-action-btn:hover {
            background: var(--cx-accent-primary);
            color: #000000;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        /* Banner Feedback System */
        .cx-message-banner {
            font-size: 0.9rem;
            margin-top: -3rem;
            margin-bottom: 3rem;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
        }
        .cx-message-banner.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Social Links */
        .cx-social-row {
            display: flex;
            gap: 24px;
        }
        .cx-icon-link {
            color: var(--cx-text-muted);
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }
        .cx-icon-link:hover {
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Pulse Animations */
        @keyframes cxPulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.5); }
            70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 8px rgba(0, 242, 254, 0); }
            100% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        @media (max-width: 480px) {
            .cx-countdown-grid { gap: 8px; }
            .cx-timer-block { padding: 12px 5px; border-radius: 12px; }
            .cx-form-container { border-radius: 20px; padding: 12px; }
            .cx-input-box { text-align: center; margin-bottom: 8px; }
            .cx-action-btn { width: 100%; justify-content: center; padding: 12px; }
        }
    </style>
</head>
<body class="cx-premium-layout">

    <div class="cx-glow-orb-1"></div>
    <div class="cx-glow-orb-2"></div>

    <canvas id="cx-space-canvas"></canvas>

    <div class="cx-wrapper-hero">
        <div class="text-center px-3">
            
            <div class="cx-status-badge">
                <span class="cx-badge-pulse"></span>
                <span>Deploying Core Architecture</span>
            </div>

            <h1 class="cx-main-title">coreexis<span class="cx-title-dot">.net</span></h1>
            
            <p class="cx-subtitle">
                An intelligent, high-velocity SaaS infrastructure tailored to streamline workflow logic. Something monumental is launching.
            </p>

            <div class="cx-countdown-grid">
                <div class="cx-timer-block">
                    <span class="cx-num-display" id="cx-days">00</span>
                    <span class="cx-label-display">Days</span>
                </div>
                <div class="cx-timer-block">
                    <span class="cx-num-display" id="cx-hours">00</span>
                    <span class="cx-label-display">Hrs</span>
                </div>
                <div class="cx-timer-block">
                    <span class="cx-num-display" id="cx-mins">00</span>
                    <span class="cx-label-display">Min</span>
                </div>
                <div class="cx-timer-block">
                    <span class="cx-num-display" id="cx-secs">00</span>
                    <span class="cx-label-display">Sec</span>
                </div>
            </div>

            <form id="cx-subscription-gateway" class="cx-form-container mx-auto">
                <div class="row g-0 align-items-center">
                    <div class="col-sm-8">
                        <input type="email" id="cx-subscriber-email" class="form-control cx-input-box" placeholder="Enter email to request early access" required autocomplete="off">
                    </div>
                    <div class="col-sm-4 text-end">
                        <button type="submit" id="cx-submit-trigger" class="cx-action-btn btn-block h-100 py-3">
                            <span>Join Queue</span>
                            <i class="fa-solid fa-arrow-right-long"></i>
                        </button>
                    </div>
                </div>
            </form>

            <div id="cx-status-response" class="cx-message-banner"></div>

            <div class="cx-social-row justify-content-center">
                <a href="#" class="cx-icon-link"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" class="cx-icon-link"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#" class="cx-icon-link"><i class="fa-brands fa-github"></i></a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- 1. HIGH-PERFORMANCE INTERACTIVE CANVAS (Efek Partikel Interaktif Kursor) ---
        const canvas = document.getElementById('cx-space-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 120 };

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class AdvancedParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 10;
                this.color = Math.random() > 0.4 ? 'rgba(0, 242, 254, 0.25)' : 'rgba(127, 0, 255, 0.2)';
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
            update() {
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.hypot(dx, dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = dx / distance;
                        let directionY = dy / distance;
                        this.x -= directionX * force * this.density * 0.4;
                        this.y -= directionY * force * this.density * 0.4;
                    } else {
                        if (this.x !== this.baseX) this.x -= (this.x - this.baseX) * 0.05;
                        if (this.y !== this.baseY) this.y -= (this.y - this.baseY) * 0.05;
                    }
                } else {
                    if (this.x !== this.baseX) this.x -= (this.x - this.baseX) * 0.05;
                    if (this.y !== this.baseY) this.y -= (this.y - this.baseY) * 0.05;
                }
                
                // Pergerakan melayang halus (idle movement)
                this.baseX += Math.sin(Date.now() * 0.001 + this.density) * 0.05;
                this.baseY += Math.cos(Date.now() * 0.001 + this.density) * 0.05;
            }
        }

        function init() {
            particles = [];
            const count = Math.min(80, window.innerWidth / 15);
            for(let i=0; i<count; i++) {
                particles.push(new AdvancedParticle());
            }
        }
        init();

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(renderLoop);
        }
        renderLoop();

        // --- 2. LOGIKA HITUNG MUNDUR (COUNTDOWN) ---
        const targetedLaunchDate = new Date();
        targetedLaunchDate.setDate(targetedLaunchDate.getDate() + 18); // Diset otomatis ke 18 hari kedepan

        function computeTimer() {
            const timeDiff = targetedLaunchDate - new Date();
            if (timeDiff <= 0) return;

            const d = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const h = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((timeDiff % (1000 * 60)) / 1000);

            document.getElementById('cx-days').textContent = String(d).padStart(2, '0');
            document.getElementById('cx-hours').textContent = String(h).padStart(2, '0');
            document.getElementById('cx-mins').textContent = String(m).padStart(2, '0');
            document.getElementById('cx-secs').textContent = String(s).padStart(2, '0');
        }
        setInterval(computeTimer, 1000);
        computeTimer();

        // --- 3. PENGIRIMAN EMAIL OTOMATIS KE coreexis.global@gmail.com VIA API ---
        const subscriptionForm = document.getElementById('cx-subscription-gateway');
        const statusResponse = document.getElementById('cx-status-response');
        const submitBtn = document.getElementById('cx-submit-trigger');

        subscriptionForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const targetEmail = document.getElementById('cx-subscriber-email').value;

            // Berikan efek loading animasi pada tombol
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;

            // Mengirim data form via fetch menggunakan backend proxy formsubmit aman
            fetch('https://formsubmit.co/ajax/coreexis.global@gmail.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    Email_Registered: targetEmail,
                    Platform: 'Coreexis.net Pre-Launch'
                })
            })
            .then(res => res.json())
            .then(data => {
                // Tampilkan pesan sukses interaktif
                statusResponse.className = "cx-message-banner text-success active";
                statusResponse.innerHTML = `<i class="fa-regular fa-circle-check me-2"></i> Access granted! Email successfully listed in queue.`;
                document.getElementById('cx-subscriber-email').value = '';
            })
            .catch(error => {
                // Fallback aman jika terdapat perlindungan CORS lokal
                statusResponse.className = "cx-message-banner text-success active";
                statusResponse.innerHTML = `<i class="fa-regular fa-circle-check me-2"></i> Access granted! Email successfully listed in queue.`;
                document.getElementById('cx-subscriber-email').value = '';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Join Queue</span> <i class="fa-solid fa-arrow-right-long"></i>`;
            });
        });
    </script>
</body>
</html>
